name: Check source export
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_repo.py
      - name: Check shell syntax
        run: bash -n mod/build.sh cloud/build_game_test.sh tools/*.sh
